description: Carousell is a Singapore-headquartered classifieds and recommerce marketplace
  founded in 2012 that lets people buy and sell secondhand and new goods, cars, and property
  across Southeast Asia, Hong Kong, and Taiwan. The Carousell Group operates a family of
  consumer marketplace brands including Carousell, Cho Tot, Mudah, OneShift, Laku6, Refash,
  and Ox Street, spanning general classifieds, automotive, and recommerce verticals. Carousell
  was added to the API Evangelist network as a portfolio-company lead; it is a consumer
  marketplace with no publicly documented developer API surface at this time.
